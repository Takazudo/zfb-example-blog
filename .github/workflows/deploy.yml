# Cloudflare Workers (static assets) deploy for this zfb example.
#
#   build   — always runs (push + PR): install, typecheck (`zfb check`), build
#             (`zfb build`). Needs no Cloudflare credentials, so a fresh clone or
#             a fork is green immediately. This is the real correctness gate.
#   deploy  — push to `main` only: `wrangler deploy` (uploads the Worker AND
#             attaches the custom domain from wrangler.toml), then the live-site
#             smoke test.
#   preview — pull requests only: uploads a preview version and comments its URL
#             on the PR. Uses `wrangler versions upload`, which does NOT touch
#             routes, so previews never publish to the custom domain.
#
# Both credentialed jobs SELF-SKIP when secrets.CLOUDFLARE_API_TOKEN is unset,
# so the repo is not red-by-design before Cloudflare is wired up (and so fork
# PRs, which never receive secrets, stay green).
#
# Enable deploys by adding, in repo Settings -> Secrets and variables -> Actions:
#   CLOUDFLARE_API_TOKEN   token with Account · Workers Scripts: Edit,
#                          Account · Account Settings: Read, and
#                          Zone · Workers Routes: Edit (required by the custom
#                          domain — see docs/cloudflare-setup.md)
#   CLOUDFLARE_ACCOUNT_ID  target Cloudflare account id
name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  # Cancel superseded PR runs, but never interrupt a production deploy midway.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build (typecheck + zfb build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify zfb CLI
        run: pnpm exec zfb --version
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm build

  deploy:
    name: Deploy to Cloudflare Workers
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build

      - name: Preflight — is Cloudflare configured?
        id: preflight
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN is not set — skipping deploy. Add it and CLOUDFLARE_ACCOUNT_ID in repo Settings to enable deploys."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy
        if: steps.preflight.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy

      # Only an over-the-wire check can prove the custom domain is actually
      # attached and serving this site; the deploy step above succeeds even when
      # the domain is not yet reachable.
      #
      # SMOKE_REQUIRE_LIVE turns the script's "domain is not up yet" skips into
      # failures. The custom domain for this repo is attached and serving, so a
      # skip here would mean the site fell off the internet — which must be red,
      # not a ::notice:: nobody reads. See scripts/smoke.mjs.
      - name: Smoke test the live site
        if: steps.preflight.outputs.ready == 'true'
        env:
          SMOKE_REQUIRE_LIVE: "1"
        run: node scripts/smoke.mjs

  preview:
    name: Preview deploy
    needs: build
    # Fork PRs never receive repository secrets, so a preview could only fail
    # there. Skip the job outright rather than letting it run and self-skip.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build

      - name: Preflight — is Cloudflare configured?
        id: preflight
        env:
          # Fork PRs never receive secrets, so this is also the fork guard.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN is not available (unset, or this is a fork PR) — skipping preview deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload preview version
        id: preview
        if: steps.preflight.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # Machine-readable NDJSON record of what wrangler did. The account's
          # workers.dev subdomain is not known here, so the preview URL cannot be
          # templated — and scraping the human-readable stdout is brittle. This
          # file is the interface wrangler provides for CI.
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson
        run: |
          pnpm exec wrangler versions upload \
            --preview-alias "pr-${PR_NUMBER}" \
            --message "Preview for PR #${PR_NUMBER}"

          PREVIEW_URL=$(jq -r 'select(.type == "version-upload") | .preview_alias_url // empty' \
            "$WRANGLER_OUTPUT_FILE_PATH" | head -1)

          if [ -z "$PREVIEW_URL" ]; then
            # Preview URLs additionally require the account to have a workers.dev
            # subdomain with preview routing enabled (see wrangler.toml).
            echo "::notice::Preview version uploaded, but no preview URL was reported — skipping the PR comment."
          fi
          echo "preview_url=${PREVIEW_URL}" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL on the PR
        if: steps.preview.outputs.preview_url != ''
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.preview_url }}
        with:
          script: |
            const previewUrl = process.env.PREVIEW_URL;
            const marker = '<!-- cf-preview-branch -->';
            const body = `${marker}\n### Preview deployed\n\nThis PR is live at: ${previewUrl}\n\n_Updated for commit \`${context.sha.substring(0, 7)}\`._`;

            // Paginate — with the default page size an older marker comment on a
            // long PR would be missed and a duplicate posted every run.
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((c) => c.body && c.body.startsWith(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
